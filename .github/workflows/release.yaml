name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            goarch: arm64
          - os: macos-latest
            platform: darwin
            goarch: amd64
          - os: windows-latest
            platform: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mingw-w64 (Windows CGO)
        if: matrix.platform == 'windows'
        uses: bwoodsend/setup-winlibs-action@v1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx vite build

      - name: Build Go binary
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            go build -o "build/bin/netcatcher.exe" .
          else
            go build -o "build/bin/netcatcher" .
          fi

      - name: Package macOS .dmg
        if: matrix.platform == 'darwin'
        run: |
          APP="build/NetCatcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp build/bin/netcatcher "$APP/Contents/MacOS/NetCatcher"
          cp build/appicon.png "$APP/Contents/Resources/appicon.png"

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>NetCatcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.attson.netcatcher</string>
            <key>CFBundleName</key>
            <string>NetCatcher</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          DMG_NAME="NetCatcher-${{ matrix.goarch }}.dmg"
          hdiutil create -volname "NetCatcher" -srcfolder build/NetCatcher.app -ov -format UDZO "build/bin/$DMG_NAME"
          rm -rf build/NetCatcher.app build/bin/netcatcher

      - name: Rename Windows binary
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mv build/bin/netcatcher.exe "build/bin/NetCatcher-${{ matrix.goarch }}.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcatcher-${{ matrix.platform }}-${{ matrix.goarch }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

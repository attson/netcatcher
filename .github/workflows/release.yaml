name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            goarch: arm64
          - os: macos-latest
            platform: darwin
            goarch: amd64
          - os: windows-latest
            platform: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mingw-w64 (Windows CGO)
        if: matrix.platform == 'windows'
        uses: bwoodsend/setup-winlibs-action@v1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: cd frontend && npx vite build

      - name: Embed Windows icon + version info
        if: matrix.platform == 'windows'
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          IFS='.' read -r MAJ MIN PAT <<< "${APP_VERSION:-0.0.0}"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          "$(go env GOPATH)/bin/goversioninfo" \
            -icon=build/appicon.ico \
            -manifest=build/netcatcher.manifest \
            -o=appicon_windows_amd64.syso \
            -ver-major=$MAJ -ver-minor=$MIN -ver-patch=$PAT -ver-build=0 \
            -product-ver-major=$MAJ -product-ver-minor=$MIN -product-ver-patch=$PAT -product-ver-build=0 \
            -file-version="${APP_VERSION}" \
            -product-version="${APP_VERSION}" \
            versioninfo.json

      - name: Build Go binary
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            go build -ldflags="-H=windowsgui" -o "build/bin/netcatcher.exe" .
          else
            go build -o "build/bin/netcatcher" .
          fi

      - name: Package macOS .dmg
        if: matrix.platform == 'darwin'
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP="build/NetCatcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp build/bin/netcatcher "$APP/Contents/MacOS/NetCatcher"

          # Convert PNG to icns
          ICONSET="build/appicon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16     build/appicon.png --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     build/appicon.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     build/appicon.png --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     build/appicon.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   build/appicon.png --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   build/appicon.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   build/appicon.png --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   build/appicon.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   build/appicon.png --out "$ICONSET/icon_512x512.png"
          cp build/appicon.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/appicon.icns"
          rm -rf "$ICONSET"

          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>NetCatcher</string>
            <key>CFBundleIconFile</key>
            <string>appicon</string>
            <key>CFBundleIdentifier</key>
            <string>com.attson.netcatcher</string>
            <key>CFBundleName</key>
            <string>NetCatcher</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Re-sign the Mach-O with the bundle identifier. The Go linker-signed
          # "a.out" identifier doesn't match CFBundleIdentifier, which on
          # macOS Sequoia causes "is damaged" errors once the DMG is opened
          # (com.apple.quarantine + mismatched identifier trips Gatekeeper).
          codesign --force --sign - --identifier com.attson.netcatcher \
            "$APP/Contents/MacOS/NetCatcher"

          DMG_DIR="build/dmg-contents"
          mkdir -p "$DMG_DIR"
          mv build/NetCatcher.app "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          DMG_NAME="NetCatcher-${{ matrix.goarch }}.dmg"
          hdiutil create -volname "NetCatcher" -srcfolder "$DMG_DIR" -ov -format UDZO "build/bin/$DMG_NAME"
          rm -rf "$DMG_DIR" build/bin/netcatcher

      - name: Rename Windows binary
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mv build/bin/netcatcher.exe "build/bin/NetCatcher-${{ matrix.goarch }}.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcatcher-${{ matrix.platform }}-${{ matrix.goarch }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            goarch: arm64
          - os: macos-latest
            platform: darwin
            goarch: amd64
          - os: windows-latest
            platform: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx vite build

      - name: Build Go binary
        run: |
          mkdir -p build/bin
          EXT=""
          if [ "${{ matrix.platform }}" = "windows" ]; then EXT=".exe"; fi
          go build -o "build/bin/netcatcher-${{ matrix.platform }}-${{ matrix.goarch }}${EXT}" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netcatcher-${{ matrix.platform }}-${{ matrix.goarch }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
